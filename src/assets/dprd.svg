<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>

    <!-- Header / Navbar Gradient -->
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f1622" />
    </linearGradient>

    <!-- Accent Gold / Bronze Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2438" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- Ambient Glow Behind Hero -->
  <circle cx="400" cy="180" r="220" fill="#3b82f6" opacity="0.12" filter="blur(60px)" />
  <circle cx="650" cy="300" r="180" fill="#f59e0b" opacity="0.08" filter="blur(50px)" />

  <!-- Top Browser Frame Header -->
  <rect width="800" height="42" fill="#0d111a" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1f2937" stroke-width="1" />
  <!-- Traffic Dots -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8" />

  <!-- Browser URL Bar -->
  <rect x="180" y="10" width="440" height="22" rx="11" fill="#161f30" stroke="#25334d" stroke-width="1" />
  <text x="400" y="25" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    🔒 https://dprd.purbalinggakab.go.id
  </text>

  <!-- Website Main Navbar -->
  <rect x="0" y="42" width="800" height="60" fill="url(#navGrad)" />
  <line x1="0" y1="102" x2="800" y2="102" stroke="#233047" stroke-width="1" />

  <!-- Logo & Title in Navbar -->
  <g transform="translate(36, 56)">
    <!-- Shield / Emblem Icon -->
    <polygon points="16,2 30,8 30,22 16,30 2,22 2,8" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M16 7 L24 11 L24 20 L16 25 L8 20 L8 11 Z" fill="#0f172a" />
    <polygon points="16,11 20,18 12,18" fill="url(#goldGrad)" />
    <!-- Title Text -->
    <text x="42" y="16" fill="#ffffff" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">DPRD KABUPATEN PURBALINGGA</text>
    <text x="42" y="28" fill="#94a3b8" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">PORTAL RESMI &amp; LAYANAN INFORMASI PUBLIK</text>
  </g>

  <!-- Nav Menu Links -->
  <g fill="#cbd5e1" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" transform="translate(480, 77)">
    <text x="0" y="0" fill="#ffffff" font-weight="700">Beranda</text>
    <text x="60" y="0">Profil</text>
    <text x="110" y="0">Fraksi</text>
    <text x="160" y="0">Komisi</text>
    <text x="215" y="0">JDIH</text>
    <text x="260" y="0">Aspirasi</text>
  </g>

  <!-- Hero Banner Area -->
  <rect x="36" y="122" width="728" height="150" rx="12" fill="url(#cardGrad)" stroke="#27354f" stroke-width="1" />
  
  <!-- Hero Content Left -->
  <g transform="translate(64, 150)">
    <!-- Badge -->
    <rect x="0" y="0" width="168" height="22" rx="11" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.3)" stroke-width="1" />
    <circle cx="10" cy="11" r="3" fill="#fbbf24" />
    <text x="20" y="14" fill="#fbbf24" font-size="9.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">TRANSFORMATIF &amp; ASPIRATIF</text>

    <!-- Main Headline -->
    <text x="0" y="44" fill="#ffffff" font-size="20" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      Sinergi Membangun Purbalingga
    </text>
    <text x="0" y="65" fill="#94a3b8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      Transparansi legislasi, pengawasan anggaran, serta penyalur aspirasi warga
    </text>
    <text x="0" y="80" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      Bumi Perwira secara terbuka, akuntabel, dan digital.
    </text>

    <!-- Action Buttons -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="120" height="28" rx="6" fill="#2563eb" />
      <text x="60" y="18" fill="#ffffff" font-size="10.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Sampaikan Aspirasi</text>

      <rect x="130" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="182" y="18" fill="#e2e8f0" font-size="10.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Agenda Sidang</text>
    </g>
  </g>

  <!-- Hero Illustration / Graphic Right -->
  <g transform="translate(560, 140)">
    <!-- Dome / Architecture Silhoutte -->
    <circle cx="100" cy="70" r="55" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
    <circle cx="100" cy="70" r="42" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" />
    
    <!-- Parliament Pillar Vector -->
    <path d="M 60 110 L 140 110 L 135 105 L 65 105 Z" fill="#64748b" />
    <path d="M 65 105 L 72 65 L 78 65 L 75 105 Z" fill="#94a3b8" opacity="0.8" />
    <path d="M 82 105 L 87 65 L 93 65 L 90 105 Z" fill="#cbd5e1" opacity="0.9" />
    <path d="M 97 105 L 100 65 L 106 65 L 105 105 Z" fill="#e2e8f0" />
    <path d="M 112 105 L 113 65 L 119 65 L 120 105 Z" fill="#cbd5e1" opacity="0.9" />
    <path d="M 127 105 L 124 65 L 130 65 L 135 105 Z" fill="#94a3b8" opacity="0.8" />
    <polygon points="100,32 55,65 145,65" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="100" cy="52" r="5" fill="#0f172a" />
  </g>

  <!-- 3 Mini Feature / Dashboard Cards Below Hero -->
  <!-- Card 1: Agenda Paripurna -->
  <g transform="translate(36, 290)">
    <rect width="228" height="154" rx="10" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <rect x="14" y="16" width="30" height="30" rx="8" fill="#1e293b" />
    <text x="29" y="36" fill="#38bdf8" font-size="14" text-anchor="middle">📅</text>
    <text x="54" y="28" fill="#ffffff" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Agenda Paripurna</text>
    <text x="54" y="42" fill="#64748b" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Jadwal Sidang &amp; Rapat Kerja</text>

    <!-- Mini List Items -->
    <rect x="14" y="60" width="200" height="36" rx="6" fill="#161f30" />
    <text x="24" y="76" fill="#e2e8f0" font-size="9.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Rapat Banggar &amp; TAPD</text>
    <text x="24" y="89" fill="#94a3b8" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Evaluasi Realisasi PAD TA 2024</text>

    <rect x="14" y="104" width="200" height="36" rx="6" fill="#161f30" />
    <text x="24" y="120" fill="#e2e8f0" font-size="9.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Rapat Paripurna Dewan</text>
    <text x="24" y="133" fill="#94a3b8" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Penyampaian Raperda Inisiatif</text>
  </g>

  <!-- Card 2: Produk Hukum JDIH -->
  <g transform="translate(286, 290)">
    <rect width="228" height="154" rx="10" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <rect x="14" y="16" width="30" height="30" rx="8" fill="#1e293b" />
    <text x="29" y="36" fill="#f59e0b" font-size="14" text-anchor="middle">⚖️</text>
    <text x="54" y="28" fill="#ffffff" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">JDIH &amp; Regulasi</text>
    <text x="54" y="42" fill="#64748b" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Database Perda &amp; Keputusan</text>

    <!-- Mini Progress / Stats -->
    <rect x="14" y="60" width="200" height="26" rx="4" fill="#161f30" />
    <text x="24" y="77" fill="#cbd5e1" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Peraturan Daerah (Perda)</text>
    <text x="195" y="77" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="end">48 Docs</text>

    <rect x="14" y="92" width="200" height="26" rx="4" fill="#161f30" />
    <text x="24" y="109" fill="#cbd5e1" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Keputusan Pimpinan DPRD</text>
    <text x="195" y="109" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="end">112 Docs</text>

    <rect x="14" y="124" width="200" height="18" rx="4" fill="rgba(37,99,235,0.12)" />
    <text x="114" y="137" fill="#60a5fa" font-size="8.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Buka JDIH Portal →</text>
  </g>

  <!-- Card 3: Layanan E-Aspirasi & Komisi -->
  <g transform="translate(536, 290)">
    <rect width="228" height="154" rx="10" fill="#111827" stroke="#1f293d" stroke-width="1" />
    <rect x="14" y="16" width="30" height="30" rx="8" fill="#1e293b" />
    <text x="29" y="36" fill="#10b981" font-size="14" text-anchor="middle">📢</text>
    <text x="54" y="28" fill="#ffffff" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">E-Aspirasi Rakyat</text>
    <text x="54" y="42" fill="#64748b" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Saluran Interaktif Masyarakat</text>

    <!-- Stat boxes -->
    <g transform="translate(14, 60)">
      <rect width="95" height="50" rx="6" fill="#161f30" />
      <text x="47" y="22" fill="#10b981" font-size="16" font-weight="700" text-anchor="middle">98.4%</text>
      <text x="47" y="38" fill="#94a3b8" font-size="8.5" text-anchor="middle">Tindak Lanjut</text>

      <rect x="105" width="95" height="50" rx="6" fill="#161f30" />
      <text x="152" y="22" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle">4 Komisi</text>
      <text x="152" y="38" fill="#94a3b8" font-size="8.5" text-anchor="middle">Bidang Kerja</text>
    </g>

    <rect x="14" y="120" width="200" height="22" rx="4" fill="#10b981" opacity="0.15" />
    <text x="114" y="135" fill="#34d399" font-size="8.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Status Layanan: Online &amp; Terintegrasi</text>
  </g>
</svg>
